version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: rentmate-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: rentmate
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: rentmate
      MYSQL_PASSWORD: rentmate123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - rentmate-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rentmate-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: rentmate
      DB_USERNAME: rentmate
      DB_PASSWORD: rentmate123
      JWT_SECRET: rentmate-super-secret-key-change-in-production-environment
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - rentmate-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rentmate-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - rentmate-network

volumes:
  mysql-data:
    driver: local

networks:
  rentmate-network:
    driver: bridge

